<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPulse</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
  <!-- Top Bar -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">⚡ DevPulse</span>
      <span class="date" id="currentDate"></span>
    </div>
    <div class="topbar-right">
      <div class="search-box">
        <input type="text" id="globalSearch" placeholder="Search notes, tasks..." />
        <kbd>/</kbd>
      </div>
      <button class="btn-icon" id="themeToggle" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="dashboard">
    <!-- Left Column -->
    <section class="col-left">
      <!-- Pomodoro -->
      <div class="card pomodoro-card" id="pomodoroCard">
        <div class="card-header">
          <h3>🍅 Pomodoro</h3>
          <div class="pomodoro-dots">
            <span class="dot" data-idx="0"></span>
            <span class="dot" data-idx="1"></span>
            <span class="dot" data-idx="2"></span>
            <span class="dot" data-idx="3"></span>
          </div>
        </div>
        <div class="pomodoro-display">
          <div class="pomodoro-time" id="pomodoroTime">25:00</div>
          <div class="pomodoro-label" id="pomodoroLabel">Focus Time</div>
        </div>
        <div class="pomodoro-controls">
          <button class="btn btn-primary" id="pomodoroStart">Start</button>
          <button class="btn btn-ghost" id="pomodoroReset">Reset</button>
          <button class="btn btn-ghost" id="pomodoroSkip">Skip</button>
        </div>
        <div class="pomodoro-stats">
          <span id="pomodoroTodayCount">0</span> sessions today · <span id="pomodoroTodayMin">0</span> min focused
        </div>
      </div>

      <!-- Daily Goals -->
      <div class="card">
        <div class="card-header">
          <h3>🎯 Today's Goals</h3>
          <span class="badge" id="goalsProgress">0/0</span>
        </div>
        <div class="goal-input">
          <input type="text" id="goalInput" placeholder="Add a goal for today..." />
          <button class="btn btn-sm" id="goalAdd">+</button>
        </div>
        <ul class="goal-list" id="goalList"></ul>
      </div>

      <!-- Quick Launcher -->
      <div class="card">
        <div class="card-header">
          <h3>🚀 Quick Launch</h3>
          <button class="btn btn-sm btn-ghost" id="addBookmarkBtn">+ Add</button>
        </div>
        <div class="bookmark-grid" id="bookmarkGrid"></div>
      </div>
    </section>

    <!-- Center Column -->
    <section class="col-center">
      <!-- Stats Bar -->
      <div class="stats-bar" id="statsBar">
        <div class="stat-item">
          <div class="stat-value" id="statTasksDone">0</div>
          <div class="stat-label">Tasks Done</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statTasksPending">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statNotes">0</div>
          <div class="stat-label">Notes</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="statPomodoros">0</div>
          <div class="stat-label">Pomodoros</div>
        </div>
      </div>

      <!-- Tasks -->
      <div class="card">
        <div class="card-header">
          <h3>✅ Tasks</h3>
          <div class="task-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="done">Done</button>
          </div>
        </div>
        <div class="task-input">
          <input type="text" id="taskInput" placeholder="What needs to be done?" />
          <select id="taskPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button class="btn btn-primary" id="taskAdd">Add</button>
        </div>
        <ul class="task-list" id="taskList"></ul>
      </div>

      <!-- Activity Heatmap -->
      <div class="card">
        <div class="card-header">
          <h3>📊 Activity (30 days)</h3>
        </div>
        <div class="heatmap" id="heatmap"></div>
      </div>
    </section>

    <!-- Right Column -->
    <section class="col-right">
      <!-- Notes -->
      <div class="card notes-card">
        <div class="card-header">
          <h3>📝 Notes</h3>
          <button class="btn btn-primary btn-sm" id="newNoteBtn">+ New</button>
        </div>
        <div class="notes-search">
          <input type="text" id="noteSearch" placeholder="Search notes..." />
        </div>
        <div class="notes-list" id="notesList"></div>
      </div>
    </section>
  </main>

  <!-- Note Editor Modal -->
  <div class="modal-overlay" id="noteModal">
    <div class="modal">
      <div class="modal-header">
        <input type="text" id="noteTitle" placeholder="Note title..." class="modal-title-input" />
        <button class="btn-icon modal-close" id="noteModalClose">✕</button>
      </div>
      <div class="modal-tags">
        <input type="text" id="noteTags" placeholder="Tags (comma separated)..." />
      </div>
      <textarea id="noteContent" placeholder="Write your note here... Markdown supported."></textarea>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="noteDelete" style="display:none">Delete</button>
        <div class="modal-footer-right">
          <button class="btn btn-ghost" id="noteCancel">Cancel</button>
          <button class="btn btn-primary" id="noteSave">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bookmark Modal -->
  <div class="modal-overlay" id="bookmarkModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h3>Add Bookmark</h3>
        <button class="btn-icon modal-close" id="bookmarkModalClose">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="bmTitle" placeholder="Title" />
        <input type="url" id="bmUrl" placeholder="https://..." />
        <input type="text" id="bmCategory" placeholder="Category" />
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="bookmarkCancel">Cancel</button>
        <button class="btn btn-primary" id="bookmarkSave">Save</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
